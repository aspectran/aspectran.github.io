aspectow:
  hero:
    title: 고성능 WAS & 관제 플랫폼
    lead: 신뢰할 수 있는 엔터프라이즈 웹 서버 기능과 클러스터 관리, 원격 명령, 분산 스케줄링 및 실시간 관제를 통합 제공하는 웹 애플리케이션 플랫폼입니다.
    icon: bi-layers-half
    buttons:
      - title: Why Aspectow?
        url: /ko/why-aspectow/
        class: btn-primary
      - title: 시작하기
        url: /ko/docs/aspectow/getting-started/
        class: btn-outline-secondary
        icon: bi-play-fill
      - title: 콘솔 데모
        url: https://public.aspectran.com/console-demo
        target: _blank
        class: btn-outline-secondary
        icon: bi-box-arrow-up-right

  sections:
    - title: Aspectow Console (통합 관제)
      anchor: aspectow-console
      cards:
        - title: Console 개요 및 아키텍처
          url: /ko/docs/aspectow/console/
          description: 노드 내장형 관제 아키텍처, Direct 및 Gateway (Redis Pub/Sub) 통신 파이프라인과 주요 구성을 소개합니다.
        - title: 주요 화면 및 기능 가이드
          url: /ko/docs/aspectow/console/feature-guide/
          description: 노드 생존 감시, 일괄 제어, 원격 명령 센터, 분산 스케줄러, Vault 및 개발자 도구의 화면별 세부 안내서입니다.
        - title: 운영 보안 아키텍처 가이드
          url: /ko/docs/aspectow/console/security-architecture/
          description: 엔터프라이즈 전용 관리 노드 분리 아키텍처, IP 통제 방안, 내장 보안 메커니즘 및 체크리스트 가이드입니다.
      tags:
        - title: Console 구성 가이드
          url: /ko/docs/aspectow/console/configuration-guide/
        - title: 운영 보안 가이드
          url: /ko/docs/aspectow/console/security-architecture/
        - title: 노드 일괄 제어
          url: /ko/docs/aspectow/console/feature-guide/#31-클러스터-노드-관리-cluster-nodes
        - title: 원격 명령 센터
          url: /ko/docs/aspectow/console/feature-guide/#32-원격-명령-센터-remote-commands
        - title: 분산 스케줄러 관리자
          url: /ko/docs/aspectow/console/feature-guide/#33-스케줄러-관리자-scheduler-manager
        - title: Vault 보안 토큰
          url: /ko/docs/aspectow/console/feature-guide/#51-vault-토큰-관리-vault-management

    - title: 운영 및 환경 설정 가이드
      anchor: aspectow
      cards:
        - title: 서버 환경 설정 가이드
          url: /ko/docs/aspectow/configuration-guide/
          description: Aspectow의 서버 구조와 실운영 환경을 위한 핵심 기능 설정에 대한 체계적인 지침을 제공합니다.
        - title: Node Manager 가이드
          url: /ko/docs/aspectow/node-manager/
          description: 분산 멀티 노드 클러스터를 유기적으로 결합하고 라우팅 및 릴레이 패킷을 통제하는 핵심 제어 평면 라이브러리 가이드입니다.
        - title: 배포 및 서비스 운영
          url: /ko/docs/aspectow/deployment-and-operations/
          description: 애플리케이션을 배포하고 다양한 운영체제에서 데몬/서비스로 관리하는 방법을 배웁니다.
      tags:
        - title: Aspectow 아키텍처
          url: /ko/docs/aspectow/architecture/
        - title: Node Manager 가이드
          url: /ko/docs/aspectow/node-manager/
        - title: 멀티 컨텍스트 세션
          url: /ko/docs/aspectow/multi-context-session-strategy/
        - title: Nginx 및 클러스터링
          url: /ko/docs/aspectow/nginx-reverse-proxy-guide/

    - title: 실시간 모니터링 (AppMon)
      anchor: aspectow-appmon
      cards:
        - title: Aspectow AppMon
          url: /ko/docs/aspectow/appmon/
          description: Canvas 트래픽 시각화, JVM 리소스 메트릭 및 역방향 로그 테일링을 제공하는 실시간 관제 솔루션입니다.
      tags:
        - title: 대시보드 가이드
          url: /ko/docs/aspectow/appmon/dashboard-guide/
        - title: 메시지 프로토콜
          url: /ko/docs/aspectow/appmon/message-protocol/
        - title: 이벤트 데이터 구조
          url: /ko/docs/aspectow/appmon/event-count-data-structure/
