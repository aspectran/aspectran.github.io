aspectow:
  hero:
    title: High-Performance WAS & Management Platform
    lead: A web application platform offering reliable enterprise web server features integrated with cluster control, remote commands, distributed scheduling, and real-time monitoring.
    icon: bi-layers-half
    buttons:
      - title: Why Aspectow?
        url: /en/why-aspectow/
        class: btn-primary
      - title: Get Started
        url: /en/docs/aspectow/getting-started/
        class: btn-outline-secondary
        icon: bi-play-fill

  sections:
    - title: Aspectow Console (Unified Control)
      anchor: aspectow-console
      cards:
        - title: Console Overview & Architecture
          url: /en/docs/aspectow/console/
          description: Introduces the embedded console architecture, Direct & Gateway (Redis Pub/Sub) pipelines, and key configurations.
        - title: Screen & Feature Guide
          url: /en/docs/aspectow/feature-guide/
          description: Screen-by-screen guide for node health monitoring, bulk control, remote command center, scheduler, Vault, and developer tools.
      tags:
        - title: Console Config Guide
          url: /en/docs/aspectow/console/configuration-guide/
        - title: Bulk Node Control
          url: /en/docs/aspectow/feature-guide/#31-cluster-nodes
        - title: Remote Command Center
          url: /en/docs/aspectow/feature-guide/#32-remote-commands
        - title: Distributed Scheduler
          url: /en/docs/aspectow/feature-guide/#33-scheduler-manager
        - title: Vault Security Tokens
          url: /en/docs/aspectow/feature-guide/#51-vault-management

    - title: Administration & Configuration
      anchor: aspectow
      cards:
        - title: Server Configuration Guide
          url: /en/docs/aspectow/configuration-guide/
          description: Systematic guide to the server structure of Aspectow and core feature configurations for production.
        - title: Node Manager Guide
          url: /en/docs/aspectow/node-manager/
          description: Detailed guide to the core Control Plane library that organically binds distributed multi-node clusters and controls routing.
        - title: Deployment & Service Operations
          url: /en/docs/aspectow/deployment-and-operations/
          description: Learn how to deploy and manage applications as services across different operating systems.
      tags:
        - title: Aspectow Architecture
          url: /en/docs/aspectow/architecture/
        - title: Node Manager Guide
          url: /en/docs/aspectow/node-manager/
        - title: Multi-context Sessions
          url: /en/docs/aspectow/multi-context-session-strategy/
        - title: Nginx & Clustering
          url: /en/docs/aspectow/nginx-reverse-proxy-guide/

    - title: Real-time Monitoring (AppMon)
      anchor: aspectow-appmon
      cards:
        - title: Aspectow AppMon
          url: /en/docs/aspectow/appmon/
          description: Real-time monitoring solution providing Canvas traffic flow visualization, JVM resource metrics, and reverse log tailing.
      tags:
        - title: Dashboard Guide
          url: /en/docs/aspectow/appmon/dashboard-guide/
        - title: Message Protocol
          url: /en/docs/aspectow/appmon/message-protocol/
        - title: Event Data Structure
          url: /en/docs/aspectow/appmon/event-count-data-structure/
